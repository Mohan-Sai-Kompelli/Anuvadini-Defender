# =====================================================
# MARBISM Kubernetes Manifests
# =====================================================
# For large-scale deployments across multiple nodes
# Prerequisites: Kubernetes 1.20+, kubectl configured

---
# 1. Namespace
---
apiVersion: v1
kind: Namespace
metadata:
  name: marbism
  labels:
    name: marbism

---
# 2. Secrets for sensitive data
---
apiVersion: v1
kind: Secret
metadata:
  name: marbism-secrets
  namespace: marbism
type: Opaque
stringData:
  mongodb-uri: ""
  redis-url: "redis://:CHANGE_ME_PASSWORD@redis-service:6379"
  jwt-secret: "CHANGE_ME_STRONG_JWT_SECRET_64_CHARS"
  mongo-username: "marbism_user"
  mongo-password: "CHANGE_ME_PASSWORD"
  redis-password: "CHANGE_ME_PASSWORD"
  grafana-password: "CHANGE_ME_PASSWORD"

---
# 3. ConfigMap for application config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: marbism-config
  namespace: marbism
data:
  NODE_ENV: "production"
  PORT: "5001"
  FEATURE_LIVENESS_CHALLENGE: "true"
  FEATURE_CONSULTATION_LOGS: "true"
  FEATURE_SHIFT_SCHEDULES: "true"
  FEATURE_DEVICE_BINDING: "true"
  FEATURE_PHOTO_TAMPERING: "true"
  FEATURE_GPS_SPOOFING: "true"
  FEATURE_OUTREACH_ACTIVITIES: "true"
  FEATURE_HOI_DASHBOARD: "true"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "https://marbism.your-domain.com,https://api.marbism.your-domain.com"

---
# 4. PersistentVolumeClaims for storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data-pvc
  namespace: marbism
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 50Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-pvc
  namespace: marbism
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data-pvc
  namespace: marbism
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data-pvc
  namespace: marbism
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi

---
# 5. MongoDB StatefulSet
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: marbism
spec:
  serviceName: mongodb-service
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:6.0
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: marbism-secrets
              key: mongo-username
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: marbism-secrets
              key: mongo-password
        - name: MONGO_INITDB_DATABASE
          value: "marbism"
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        - name: mongodb-logs
          mountPath: /var/log/mongodb
        livenessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-data-pvc
      - name: mongodb-logs
        emptyDir: {}

---
# 6. MongoDB Service
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: marbism
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
  - port: 27017
    targetPort: 27017

---
# 7. Redis Deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: marbism
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: marbism-secrets
              key: redis-password
        command:
          - redis-server
          - --requirepass
          - "$(REDIS_PASSWORD)"
          - --appendonly
          - "yes"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-data-pvc

---
# 8. Redis Service
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: marbism
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379

---
# 9. Backend Deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marbism-backend
  namespace: marbism
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: marbism-backend
  template:
    metadata:
      labels:
        app: marbism-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5001"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - marbism-backend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: backend
        image: marbism-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5001
          name: http
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: marbism-secrets
              key: mongodb-uri
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: marbism-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: marbism-secrets
              key: jwt-secret
        envFrom:
        - configMapRef:
            name: marbism-config
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5001
            scheme: HTTP
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5001
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: logs
          mountPath: /app/logs
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
      volumes:
      - name: uploads
        emptyDir: {}
      - name: logs
        emptyDir: {}
      securityContext:
        fsGroup: 1001

---
# 10. Backend Service
---
apiVersion: v1
kind: Service
metadata:
  name: marbism-backend-service
  namespace: marbism
spec:
  type: ClusterIP
  selector:
    app: marbism-backend
  ports:
  - port: 5001
    targetPort: 5001
    name: http

---
# 11. Backend HorizontalPodAutoscaler
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: marbism-backend-hpa
  namespace: marbism
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: marbism-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60

---
# 12. Web Dashboard Deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marbism-web
  namespace: marbism
spec:
  replicas: 2
  selector:
    matchLabels:
      app: marbism-web
  template:
    metadata:
      labels:
        app: marbism-web
    spec:
      containers:
      - name: web
        image: marbism-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: REACT_APP_API_URL
          value: "https://api.marbism.your-domain.com"
        - name: REACT_APP_ENV
          value: "production"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true

---
# 13. Web Dashboard Service
---
apiVersion: v1
kind: Service
metadata:
  name: marbism-web-service
  namespace: marbism
spec:
  type: ClusterIP
  selector:
    app: marbism-web
  ports:
  - port: 3000
    targetPort: 3000

---
# 14. Ingress for external access
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marbism-ingress
  namespace: marbism
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - marbism.your-domain.com
    - api.marbism.your-domain.com
    secretName: marbism-tls-cert
  rules:
  - host: api.marbism.your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: marbism-backend-service
            port:
              number: 5001
  - host: marbism.your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: marbism-web-service
            port:
              number: 3000

---
# 15. Prometheus Deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: marbism
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--storage.tsdb.retention.time=30d'
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-data
          mountPath: /prometheus
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-data
        persistentVolumeClaim:
          claimName: prometheus-data-pvc

---
# 16. Prometheus Service
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: marbism
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090

---
# 17. Grafana Deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: marbism
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: marbism-secrets
              key: grafana-password
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
      volumes:
      - name: grafana-data
        persistentVolumeClaim:
          claimName: grafana-data-pvc

---
# 18. Grafana Service
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: marbism
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000

---
# 19. ServiceAccount for Prometheus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: marbism

---
# 20. ClusterRole for Prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups:
  - extensions
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]

---
# 21. ClusterRoleBinding for Prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: marbism

---
# 22. NetworkPolicy for security
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: marbism-network-policy
  namespace: marbism
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: marbism
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: marbism
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

# =====================================================
# Deployment Instructions
# =====================================================
# 1. Update CHANGE_ME values in Secrets
# 2. Update domain names in Ingress
# 3. Ensure PV provisioner is available
# 4. kubectl apply -f k8s-manifests.yaml
# 5. Configure cert-manager for SSL/TLS
# 6. Monitor: kubectl logs -n marbism -f deployment/marbism-backend
