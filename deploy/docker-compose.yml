version: '3.8'

services:
  apexmonitor-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: apexmonitor_hub
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
